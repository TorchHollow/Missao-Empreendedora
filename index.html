<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./Sources/logoProvisoria.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="CSS/principal.css">
    <title>Missão Empreendedora</title>
</head>

<body>

    <section class="jornal">

        <form class="jornal-form" action="...">
            <div class="jornal-container">
                <h2>Receba novidades em seu E-Mail</h2>
            </div>

            <div class="jornal-container" style="background-color:white;">
                <input class="jornal-input" type="text" placeholder="Nome" name="name" required>
                <input class="jornal-input" type="text" placeholder="Email" name="mail" required>
            </div>

            <div class="jornal-container">
                <input class="jornal-input" type="submit" value="Subscribe">
            </div>
        </form>

    </section>


    <footer id="contato">
        <div class="footer-left">
            <p>&copy; 2025 Missão Empreendedora. Todos os direitos reservados.</p>
        </div>
        <div class="footer-right">
            <h4>Contato</h4>
            <p>Email: example@mail.com</p>
            <p>Tel: (00) 99999-9999 / (00) 99999-9999</p>
            <div class="social-icons">
                <a href="..." target="_blank">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="..." target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="...." target="_blank">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>
        </div>
    </footer>


    <script src="./script.js"></script>
</body>

</html>
